# Production stack. Differs from the local docker-compose.yml in exactly the ways
# deploy/README.md says it should: it PULLS published images instead of building,
# SITE_ADDRESS is a real hostname so Caddy provisions TLS, and Postgres publishes
# no port — only the app reaches the database, over the compose network.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Required in .env beside this file:
#   GHCR_REPO           lowercase owner/repo, e.g. samueldcunha/nomeatnaan
#   IMAGE_TAG           sha-xxxxxxx from CI. Never `latest` — rollback is editing this line.
#   SITE_ADDRESS        the real hostname, e.g. order.cafename.com
#   POSTGRES_PASSWORD   not the local default. The MIGRATOR's password — owns the schema.
#   APP_DB_PASSWORD     a different password, for the role the app runs as. The migrator
#                       creates that role and grants it data access and nothing else, so
#                       the process serving the login page cannot alter the schema.
#   SEED_OWNER_PASSWORD

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cafe}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cafe} -d ${POSTGRES_DB:-cafe}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/${GHCR_REPO:?set GHCR_REPO in .env}-migrate:${IMAGE_TAG:?pin a sha- tag, not latest}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-cafe}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cafe}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:?set SEED_OWNER_PASSWORD in .env}
      # Creates/refreshes the app's own role on every deploy, including grants for any
      # table a new migration just added.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env - not the same as POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    image: ghcr.io/${GHCR_REPO}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # cafe_app, not cafe: data access only. The migrator above holds the owner password.
      DATABASE_URL: postgres://cafe_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-cafe}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to the real hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
