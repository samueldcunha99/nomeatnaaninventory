services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe
      POSTGRES_DB: cafe
      # Server clock is UTC. Display in Asia/Kolkata is the app's job.
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cafe -d cafe']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
# The `app` service lands here once there is a Next.js app to put in it (step 5+).
# A Dockerfile that builds a non-existent app would only fail. Note for then:
# build the image in CI and ship it - never run `next build` on the 4 GB VPS.
