# Native Node.js service. Database migrations run separately in GitHub Actions.
services:
  - type: web
    name: nomeatnaan
    runtime: node
    region: singapore
    plan: 1c-2g
    branch: main
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && DATABASE_URL=postgres://build:build@build-time-placeholder:5432/build npm run build
    startCommand: npm run start -- --hostname 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_MAX_CONNECTIONS
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        sync: false
