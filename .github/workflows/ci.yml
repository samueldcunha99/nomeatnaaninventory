name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt an in-progress production migration.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://cafe:cafe@localhost:5432/cafe
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Start native PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          sudo systemctl stop postgresql
          sudo pg_conftool 16 main set port 5432
          sudo systemctl start postgresql@16-main
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE cafe LOGIN PASSWORD 'cafe';"
          sudo -u postgres createdb -O cafe cafe
          pg_isready -h localhost -p 5432
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - name: Test, and fail if any database test skipped
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log
          if grep -qE 'skipped [1-9]' /tmp/test.log; then
            echo "::error::Database tests skipped - Postgres was not reachable."
            exit 1
          fi
      - name: Prepare isolated deployment rehearsal databases
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE cafe_migrator LOGIN CREATEROLE PASSWORD 'ci-migration-only';"
          sudo -u postgres createdb -O cafe_migrator cafe_deploy
          sudo -u postgres createdb -O cafe_migrator cafe_restore
      - name: Rehearse migrations, runtime privileges, first owner, backup and restore
        env:
          NODE_ENV: production
          DATABASE_MIGRATION_URL: postgres://cafe_migrator:ci-migration-only@localhost:5432/cafe_deploy
          DATABASE_URL: postgres://cafe_app:ci-runtime-only@localhost:5432/cafe_deploy
          APP_DB_PASSWORD: ci-runtime-only
          BACKUP_DATABASE_URL: postgres://cafe_migrator:ci-migration-only@localhost:5432/cafe_deploy
          RESTORE_DATABASE_URL: postgres://cafe_migrator:ci-migration-only@localhost:5432/cafe_restore
        run: node deploy/smoke-test.ts

  build:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - name: Build Next.js
        env:
          DATABASE_URL: postgres://build:build@build-time-placeholder:5432/build
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

  # Netlify builds main from GitHub. Apply future compatible migrations separately
  # with administrative credentials before pushing code that depends on them.
  # Never give the Netlify web app migration credentials or bootstrap passwords.
