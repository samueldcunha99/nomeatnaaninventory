name: CI

# Verify on every push and PR. Publish an image only from main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Tests run against a real Postgres, not a mock. Many of them need one, and they
  # skip loudly rather than passing quietly when it is absent — so a CI run without
  # a database would be green and meaningless.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cafe
          POSTGRES_PASSWORD: cafe
          POSTGRES_DB: cafe
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cafe -d cafe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cafe:cafe@localhost:5432/cafe
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate

      - name: Test, and fail if any database test skipped
        # A green suite full of skips is not a pass. This is what stops CI silently
        # degrading into unit-tests-only if the service container ever breaks.
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log
          if grep -qE 'skipped [1-9]' /tmp/test.log; then
            echo "::error::Database tests skipped - Postgres was not reachable."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - name: Build Next.js
        env:
          DATABASE_URL: postgres://build:build@build-time-placeholder:5432/build
          SEED_OWNER_PASSWORD: build-time-placeholder
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

  # ---------------------------------------------------------------------------
  # Publish. Only from main, only after tests and build pass.
  # The image is built HERE and shipped. Never on the VPS: 4 GB OOMs on next build.
  # ---------------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # sha- tags are what the VPS pins to. `latest` is convenience only; deploy by
          # sha or digest so a rollback is a one-line change.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-migrate:latest
            ghcr.io/${{ github.repository }}-migrate:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # STUB - deploy to the VPS. Intentionally not wired up.
  # ---------------------------------------------------------------------------
  # The E2E Networks account does not exist yet. It must be created by the CLIENT, in
  # the client's name, on the client's payment method - contractual, not a preference
  # (PROJECT-SPEC 13, and PROGRESS.md "DECIDED - deployment target"). Nothing here
  # provisions anything, and no future agent should make it do so.
  #
  # Target, already decided:
  #   provider  E2E Networks, Mumbai region
  #   os        Ubuntu 24.04 LTS
  #   size      2 vCPU, 4 GB RAM
  #   auth      SSH key only, root password login disabled
  #   holder    the client
  #
  # To enable: add these repository secrets, then uncomment the job below.
  #   DEPLOY_HOST      hostname or IP of the VPS
  #   DEPLOY_USER      non-root deploy user
  #   DEPLOY_SSH_KEY   private key for that user
  #   DEPLOY_PATH      directory holding docker-compose.prod.yml and .env
  #
  # The deploy is a pull, never a build. See deploy/README.md.
  #
  # deploy:
  #   runs-on: ubuntu-latest
  #   needs: publish
  #   if: github.ref == 'refs/heads/main'
  #   environment: production
  #   steps:
  #     - name: Deploy over SSH
  #       uses: appleboy/ssh-action@v1
  #       with:
  #         host: ${{ secrets.DEPLOY_HOST }}
  #         username: ${{ secrets.DEPLOY_USER }}
  #         key: ${{ secrets.DEPLOY_SSH_KEY }}
  #         script: |
  #           cd ${{ secrets.DEPLOY_PATH }}
  #           docker compose pull
  #           docker compose up -d --remove-orphans
  #           docker image prune -f
